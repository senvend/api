syntax = "proto3";

package api.v1;

/*
 * Represents a UUID version 4.
 */
message Uuid4 {
  reserved 1;
  // Most significant bits.
  uint64 msb = 2;
  // Least significant bits.
  uint64 lsb = 3;
}

/*
 * Represents a semantic version.
 * https://semver.org/
 */
message SemanticVersion {
  // Major version.
  uint32 major = 1;
  // Minor version.
  uint32 minor = 2;
  // Patch version.
  uint32 patch = 3;
}
