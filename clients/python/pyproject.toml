# [project]
# name = "senvend-api-workspace"
# version = "0.0.1"
# description = "Public APIs to interact with the SENVEND ecosystem"
# readme = "README.md"
# requires-python = ">=3.13"
# dependencies = ["betterproto2>=0.9.1"]

[dependency-groups]
dev = [
  "basedpyright>=1.34.0",
  "betterproto2-compiler>=0.9.0",
  "pytest>=9.0.1",
  "pytest-coverage>=0.0",
  "ruff>=0.9.10",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
target-version = "py313"

[tool.pyright]
pythonVersion = "3.14"
pythonPlatform = "Linux"
reportIgnoreCommentWithoutRule = true
typeCheckingMode = "basic"
reportAny = false
