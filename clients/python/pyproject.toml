[dependency-groups]
dev = [
  "betterproto2-compiler>=0.9.0",
  "pytest>=9.0.1",
  "pytest-coverage>=0.0",
  "ruff>=0.11.0",
  "ty>=0.0.87",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
target-version = "py314"

[tool.ty.src]
# gen.sh copies it into both packages, where its relative import resolves
exclude = ["shared"]

[tool.ty.environment]
python-platform = "linux"

[tool.ty.rules]
blanket-ignore-comment = "error"
