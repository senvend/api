[dependency-groups]
dev = [
  "basedpyright>=1.34.0",
  "betterproto2-compiler>=0.9.0",
  "pytest>=9.0.1",
  "pytest-coverage>=0.0",
  "ruff>=0.11.0",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
target-version = "py314"

[tool.pyright]
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "shared"]
pythonVersion = "3.14"
pythonPlatform = "Linux"
reportIgnoreCommentWithoutRule = true
typeCheckingMode = "basic"
reportAny = false
