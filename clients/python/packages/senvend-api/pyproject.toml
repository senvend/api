[project]
name = "senvend-api"
version = "0.0.1"
description = "Public APIs to interact with the SENVEND ecosystem"
license = "MIT OR Apache-2.0"
readme = "README.md"
requires-python = ">=3.13"
# betterproto2 is pinned to the compiler series the generated code was built
# with, it raises ImportError on a mismatch (check_compiler_version).
# grpcio is not optional: the generated sync stubs import grpc at module level.
dependencies = ["betterproto2>=0.10,<0.11", "grpcio>=1.76.0"]

[project.optional-dependencies]
# kept empty so the previously documented `senvend-api[grpcio]` still resolves
grpcio = []

[tool.ruff.lint.per-file-ignores]
# betterproto2 Module level import not at top of file
"src/senvend_api/**" = ["E402"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
