[project]
name = "senvend-api"
version = "0.0.1"
description = "Public APIs to interact with the SENVEND ecosystem"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["betterproto2>=0.9.1"]

[project.optional-dependencies]
grpcio = ["grpcio>=1.76.0"]

[tool.ruff.lint.per-file-ignores]
# betterproto2 Module level import not at top of file
"src/senvend_api/**" = ["E402"]

[build-system]
requires = ["uv_build>=0.9.14,<0.10.0"]
build-backend = "uv_build"
