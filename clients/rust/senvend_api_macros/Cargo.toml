[package]
name = "senvend_api_macros"
version = "0.0.1"
description = "Procedural macros for the senvend_api crate"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true

[lints.cargo]
# cargo writes `readme` into the packaged manifest itself, then warns that
# it could be inferred. not inherited from the workspace: these crates are
# also members of the root workspace, which defines no [workspace.lints].
manual_readme = "allow"

[lib]
proc-macro = true

[dependencies]
quote.workspace = true
syn.workspace = true
